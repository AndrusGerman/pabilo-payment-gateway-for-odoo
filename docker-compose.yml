services:
  web:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    # El volumen de postgres se comparte con la rama 16.0, donde vive la base
    # `pabilo` con módulos en versión 16. Si Odoo 17 la abriera intentaría
    # cargarla y la dejaría inservible, así que solo se le permite ver bases
    # cuyo nombre empiece por `pabilo17`.
    #
    # OJO: el filtro debe resolver a UNA sola base. Si coincide con varias,
    # Odoo no sabe cuál usar en una ruta pública y /pabilo/webhook responde 404.
    command: ["odoo", "--db-filter=^pabilo17$$"]
    # Podman/WSL2: host.docker.internal por defecto apunta al gateway de la VM
    # (10.89.0.1), que no es el host Windows. Se ancla a la IP LAN del host,
    # donde el backend de Pabilo escucha con HTTP_HOST=0.0.0.0.
    extra_hosts:
      - "host.docker.internal:192.168.31.49"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata

volumes:
  odoo-web-data:
  odoo-db-data:
